<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show Builder</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M6 15h4L13 1H3z%22 fill=%22%235ed6ff%22/%3E%3C/svg%3E">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <header class="bar">
    <span id="conn" class="conn" title="Connecting…"></span>
    <strong id="title" class="title">Show</strong>
    <div class="transport">
      <button id="rewind" class="btn" title="Back to the start (Home)">⏮</button>
      <button id="play" class="btn play" title="Play / pause (space)">▶</button>
      <span id="barbeat" class="barbeat" title="Bar.beat">—</span>
      <span id="clock" class="clock">0:00.00</span>
    </div>
    <div class="spacer"></div>
    <button id="undo" class="btn" title="Undo (⌘Z)">↶</button>
    <button id="redo" class="btn" title="Redo (⇧⌘Z)">↷</button>
    <button id="blackout" class="btn" title="Blackout (B)">Blackout</button>
    <button id="output" class="btn output">DMX off</button>
  </header>
  <main class="top">
    <section id="stage" class="stage">
      <div id="labels" class="labels"></div>
      <div id="cams" class="cams"></div>
      <div id="toast" class="toast"></div>
    </section>
    <aside id="inspector" class="inspector"></aside>
  </main>
  <section id="timeline" class="timeline"></section>
  <script type="module" src="/app.js"></script>
</body>
</html>
